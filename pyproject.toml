[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-storyforge"
version = "0.1.0"
description = "Python-only interactive Twitch storytelling with persistent personas and an OBS overlay"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.7,<3",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.1,<3",
  "httpx>=0.27,<1",
  "websockets>=14,<18",
  "cryptography>=50.0.2,<51",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.9",
  "mypy>=1.13",
  "pip-audit>=2.10,<3",
  "bandit>=1.9,<2"
]

[project.scripts]
storyforge = "storyforge.diagnostics:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
storyforge = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100

[tool.coverage.run]
source = ["storyforge"]
