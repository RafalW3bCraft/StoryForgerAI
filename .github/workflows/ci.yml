name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development checks
        run: python -m pip install -e '.[dev]'

      - name: Run test suite
        run: python -m pytest -q -o faulthandler_timeout=15

      - name: Measure coverage and fail on resource leaks
        run: python -m pytest --cov=storyforge --cov-report=term-missing -q -W error::ResourceWarning

      - name: Check Ruff
        run: python -m ruff check src tests

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Check types
        run: python -m mypy src/storyforge

      - name: Compile Python sources
        run: python -m compileall -q src

      - name: Check installed dependencies
        run: python -m pip check

      - name: Audit dependencies
        run: python -m pip_audit --skip-editable

      - name: Scan Python source
        run: bandit -r src --severity-level medium --confidence-level medium -q
